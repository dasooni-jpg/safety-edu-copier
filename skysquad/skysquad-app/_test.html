<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>하늘편대 100 — 자동 테스트</title>
<style>
  body{font:14px/1.6 "Malgun Gothic",system-ui,sans-serif;background:#0b1020;color:#dfe8ff;margin:0;padding:24px}
  h1{font-size:20px;margin:0 0 6px}
  #sum{position:sticky;top:0;background:#0b1020;padding:10px 0 14px;border-bottom:1px solid #22304d;margin-bottom:12px;z-index:2}
  .big{font-size:26px;font-weight:800}
  .ok{color:#8ef0b6}.bad{color:#ff8a9a}
  .grp{margin:16px 0 6px;font-weight:800;color:#ffd166;border-left:3px solid #ffd166;padding-left:8px}
  .t{padding:2px 0 2px 18px;font-size:13px}
  .t.f{color:#ff8a9a;background:rgba(255,80,110,.09)}
  .t.p{color:#9fd4ff}
  code{color:#ffd9a0}
</style>
</head>
<body>
<h1>🛩 하늘편대 100 — 시뮬레이션 자동 테스트</h1>
<div id="sum" class="big">돌리는 중…</div>
<div id="out"></div>

<script src="sim.js"></script>
<script>
(function () {
'use strict';
const S = window.SkySim;
let pass = 0, fail = 0;
const out = document.getElementById('out');

function grp(name) { const d = document.createElement('div'); d.className = 'grp'; d.textContent = name; out.appendChild(d); }
function ok(name, cond, extra) {
  const d = document.createElement('div');
  if (cond) { pass++; d.className = 't p'; d.textContent = '✔ ' + name; }
  else { fail++; d.className = 't f'; d.textContent = '✘ ' + name + (extra ? '  — ' + extra : ''); }
  out.appendChild(d);
}
function eq(name, a, b) { ok(name, a === b, 'got ' + JSON.stringify(a) + ', want ' + JSON.stringify(b)); }
function near(name, a, b, tol) { ok(name, Math.abs(a - b) <= (tol || 1e-6), 'got ' + a + ', want ~' + b); }

/* 게임을 원하는 상태까지 돌리는 도우미 */
function run(g, ticks, each) {
  for (let i = 0; i < ticks; i++) { g.step(); if (each) each(g, i); }
  return g;
}
function newGame(stage, players) {
  const g = new S.Game({ stage: stage || 1, seed: 4242, best: 100 });
  const n = players === undefined ? 1 : players;
  for (let i = 0; i < n; i++) g.addPlayer(i + 1, 'P' + (i + 1), i);
  return g;
}
function toPlay(g) {   // ready 를 지나 play 로
  let n = 0;
  while (g.phase === 'ready' && n++ < 200) g.step();
  return g;
}
const god = (g) => { for (const p of g.players.values()) { p.invT = 999; p.hp = S.P_MAXHP; } };

// 어디선가 예외가 나면 조용히 멈추지 않고 실패 항목으로 보여 줍니다.
try {

/* ═════════ 1. 도감·상수 무결성 ═════════ */
grp('1. 도감과 상수');
eq('지역이 10곳', S.ZONES.length, 10);
eq('보스가 10기', S.BOSSES.length, 10);
eq('로스터가 10줄', S.ROSTER.length, 10);
eq('총 단계 100', S.TOTAL_STAGES, 100);
eq('무기 단계 5', S.GUN_MAX, 5);
ok('무기표가 1~5 모두 있음', S.GUNS.length === 6 && S.GUNS.slice(1).every((g) => g && g.shots.length > 0));
ok('무기는 단계가 오를수록 총알이 늘거나 세짐', (() => {
  for (let i = 1; i < 5; i++) {
    const a = S.GUNS[i], b = S.GUNS[i + 1];
    const da = a.shots.reduce((s, x) => s + x.dmg, 0), db = b.shots.reduce((s, x) => s + x.dmg, 0);
    if (db <= da) return false;
  }
  return true;
})());
ok('로스터의 적이 모두 도감에 있음', S.ROSTER.every((row) => row.every((t) => !!S.ENEMY[t])));
ok('분열기가 가리키는 적도 도감에 있음',
  Object.values(S.ENEMY).every((e) => !e.split || !!S.ENEMY[e.split]));
ok('보스마다 이름·그림·단계별 공격이 있음', S.BOSSES.every((b) =>
  b.name && b.art && b.phases.length >= 2 && b.phases.every((p) => p.atk.length >= 1 && p.move)));
ok('보스 체력이 뒤로 갈수록 커짐', (() => {
  for (let i = 1; i < S.BOSSES.length; i++) if (S.BOSSES[i].hp <= S.BOSSES[i - 1].hp) return false;
  return true;
})());
ok('보스 공격 종류가 모두 아는 것', S.BOSSES.every((b) => b.phases.every((p) => p.atk.every((a) =>
  ['radial', 'spread', 'aimed', 'rain', 'wall', 'spiral', 'homing', 'beam', 'split', 'summon', 'clone'].includes(a.k)))));
ok('보스가 부르는 부하도 도감에 있음', S.BOSSES.every((b) => b.phases.every((p) => p.atk.every((a) =>
  a.k !== 'summon' || !!S.ENEMY[a.type]))));

/* ═════════ 2. 단계 설계 ═════════ */
grp('2. 100단계 설계');
ok('1~100단계가 모두 만들어짐', (() => { for (let i = 1; i <= 100; i++) if (!S.stagePlan(i)) return false; return true; })());
ok('10의 배수는 보스 단계', (() => {
  for (let i = 1; i <= 100; i++) if (S.stagePlan(i).isBoss !== (i % 10 === 0)) return false;
  return true;
})());
ok('보스 단계마다 그 지역 보스가 붙음', (() => {
  for (let i = 10; i <= 100; i += 10) {
    const p = S.stagePlan(i);
    if (!p.boss || p.boss.key !== S.BOSSES[p.zone].key) return false;
  }
  return true;
})());
ok('지역이 10단계마다 넘어감', S.stagePlan(1).zone === 0 && S.stagePlan(10).zone === 0
  && S.stagePlan(11).zone === 1 && S.stagePlan(100).zone === 9);
ok('그 지역에 나오는 적만 등장', (() => {
  for (let i = 1; i <= 100; i++) {
    const p = S.stagePlan(i);
    for (const w of p.waves) if (!S.ROSTER[p.zone].includes(w.type)) return false;
  }
  return true;
})());
ok('한 단계 안에서 같은 적이 연달아 나오지 않음', (() => {
  for (let i = 1; i <= 100; i++) {
    const w = S.stagePlan(i).waves;
    for (let k = 1; k < w.length; k++) if (w[k].type === w[k - 1].type) return false;
  }
  return true;
})());
ok('한 단계 안에서 같은 대열이 연달아 나오지 않음', (() => {
  for (let i = 1; i <= 100; i++) {
    const w = S.stagePlan(i).waves;
    for (let k = 1; k < w.length; k++) if (w[k].form === w[k - 1].form) return false;
  }
  return true;
})());
ok('어느 단계든 적이 두 종류 이상 나옴', (() => {
  for (let i = 1; i <= 100; i++) {
    if (new Set(S.stagePlan(i).waves.map((w) => w.type)).size < 2) return false;
  }
  return true;
})());
ok('1지역부터 적이 세 종류 이상', S.ROSTER.every((r) => r.length >= 3));
ok('웨이브가 2~7개', (() => {
  for (let i = 1; i <= 100; i++) { const n = S.stagePlan(i).waves.length; if (n < 2 || n > 7) return false; }
  return true;
})());
ok('같은 단계는 언제나 똑같이 나옴(시드 고정)',
  JSON.stringify(S.stagePlan(37)) === JSON.stringify(S.stagePlan(37)));
ok('뒤 단계가 앞 단계보다 단단함', (() => {
  const a = S.stagePlan(5).waves[0].hp / S.ENEMY[S.stagePlan(5).waves[0].type].hp;
  const b = S.stagePlan(95).waves[0].hp / S.ENEMY[S.stagePlan(95).waves[0].type].hp;
  return b > a * 3;
})());
ok('사격 간격이 뒤로 갈수록 짧아짐', (() => {
  const f1 = S.stagePlan(1).tier, f2 = S.stagePlan(100).tier;
  return f1 === 0 && Math.abs(f2 - 1) < 1e-9;
})());
ok('101단계를 부르면 100으로 잘림', S.stagePlan(150).n === 100);
ok('대열 위치가 화면 안(세로)·화면 밖(가로)에서 시작', (() => {
  for (let i = 1; i <= 100; i += 7) {
    const p = S.stagePlan(i);
    for (const w of p.waves) {
      for (const s of S.buildSpawns(w, S.mulberry32(1))) {
        if (s.y < 80 || s.y > S.FIELD.h - 80) return false;
        if (s.x <= S.FIELD.w) return false;
        if (s.delay < 0) return false;
      }
    }
  }
  return true;
})());
ok('대열 인원과 실제 등장 수가 같음', (() => {
  for (let i = 1; i <= 40; i += 3) {
    for (const w of S.stagePlan(i).waves) if (S.buildSpawns(w, S.mulberry32(9)).length !== w.count) return false;
  }
  return true;
})());

/* ═════════ 3. 방·사람 ═════════ */
grp('3. 방과 조종사');
{
  const g = new S.Game({ stage: 1, seed: 1 });
  eq('아무도 없으면 idle', g.phase, 'idle');
  g.addPlayer(1, '하늘', 0);
  eq('한 명 들어오면 준비 단계 시작', g.phase, 'ready');
  eq('이름은 8글자까지', g.addPlayer(2, '아주아주아주아주긴이름', 1).name.length, 8);
  for (let i = 3; i <= S.MAX_PLAYERS; i++) g.addPlayer(i, 'P' + i, i % 6);
  eq('정원까지 들어감', g.players.size, S.MAX_PLAYERS);
  eq('정원이 넘으면 거절', g.addPlayer(99, '늦둥이', 0), null);
  g.removePlayer(1);
  eq('나가면 한 명 줄어듦', g.players.size, S.MAX_PLAYERS - 1);
  const g2 = newGame(1, 1);
  g2.removePlayer(1);
  eq('마지막 사람이 나가면 idle', g2.phase, 'idle');
  const g3 = newGame(1, 1);
  g3.setInput(1, { tx: -900, ty: 99999 });
  const p = g3.players.get(1);
  ok('입력은 경기장 안으로 잘림', p.tx === 0 && p.ty === S.FIELD.h);
  g3.setInput(1, { tx: NaN, ty: 'abc' });
  ok('이상한 입력은 무시', p.tx === 0 && p.ty === S.FIELD.h);
  g3.setInput(999, { tx: 100, ty: 100 });
  ok('없는 사람 입력은 그냥 넘어감', true);
}

/* ═════════ 4. 조종 ═════════ */
grp('4. 비행과 자동 사격');
{
  const g = toPlay(newGame(1, 1));
  const p = g.players.get(1);
  p.x = 100; p.y = 100;
  g.setInput(1, { tx: 800, ty: 100 });
  const before = p.x;
  g.step();
  ok('목표를 향해 움직임', p.x > before);
  ok('한 틱에 최대 속도보다 더 가지 못함', p.x - before <= 660 * S.DT + 0.001);
  run(g, 60);
  near('목표에 도착하면 멈춤', p.x, 800, 2);
  ok('경기장 밖으로 못 나감', (() => {
    g.setInput(1, { tx: 99999, ty: 99999 });
    run(g, 120);
    return p.x <= S.FIELD.w && p.y <= S.FIELD.h;
  })());
  const g2 = toPlay(newGame(1, 1));
  const n0 = g2.bullets.filter((b) => b.own === 1).length;
  run(g2, 12);
  ok('버튼을 안 눌러도 자동으로 쏨', g2.bullets.filter((b) => b.own === 1).length > n0);
  const g3 = toPlay(newGame(1, 1));
  const p3 = g3.players.get(1);
  p3.gun = 5;
  g3.bullets.length = 0; p3.fireCd = 0;
  g3.step();
  eq('Lv5 는 한 번에 6발', g3.bullets.filter((b) => b.own === 1).length, 6);
  ok('Lv5 는 뒤로도 한 발 쏨', g3.bullets.some((b) => b.own === 1 && b.vx < 0));
}

/* ═════════ 5. 웨이브·스테이지 진행 ═════════ */
grp('5. 단계 진행');
{
  const g = newGame(1, 1);
  eq('처음은 ready', g.phase, 'ready');
  toPlay(g);
  eq('준비가 끝나면 play', g.phase, 'play');
  run(g, 40, god);
  ok('적이 등장함', g.enemies.length > 0);
  eq('첫 웨이브가 시작됨', g.waveIdx, 1);

  // 적을 전부 없애면 다음 웨이브로 넘어가야 합니다
  const g2 = toPlay(newGame(1, 1));
  let guard = 0;
  while (g2.waveIdx < 2 && guard++ < 2000) { god(g2); g2.enemies.length = 0; g2.spawnQ.length = 0; g2.step(); }
  ok('적을 다 잡으면 다음 웨이브', g2.waveIdx >= 2);

  // 스테이지 클리어
  const g3 = toPlay(newGame(1, 1));
  guard = 0;
  while (g3.phase === 'play' && guard++ < 6000) { god(g3); g3.enemies.length = 0; g3.spawnQ.length = 0; g3.step(); }
  eq('모든 웨이브를 끝내면 클리어', g3.phase, 'clear');
  ok('클리어 보너스가 붙음', g3.score > 0);
  guard = 0;
  while (g3.phase === 'clear' && guard++ < 400) g3.step();
  eq('다음 단계로 넘어감', g3.stage, 2);
  eq('다음 단계는 다시 준비 단계', g3.phase, 'ready');
}

/* ═════════ 6. 피격·격추·구조 ═════════ */
grp('6. 격추와 구조');
{
  const g = toPlay(newGame(1, 1));
  const p = g.players.get(1);
  const dm = g.dmgMul;
  ok('1단계는 피해가 절반 남짓 (' + dm.toFixed(2) + '배)', dm > 0.5 && dm < 0.6);
  p.invT = 0;
  g.hurtPlayer(p, 30);
  near('맞으면 체력이 줄어듦', p.hp, S.P_MAXHP - 30 * dm, 0.001);
  ok('맞은 직후엔 잠깐 무적', p.invT > 0);
  g.hurtPlayer(p, 30);
  near('그 사이에는 또 안 맞음', p.hp, S.P_MAXHP - 30 * dm, 0.001);
  p.invT = 0; p.shieldT = 5;
  g.hurtPlayer(p, 30);
  ok('보호막이 한 번 막아 줌', Math.abs(p.hp - (S.P_MAXHP - 30 * dm)) < 0.001 && p.shieldT === 0);
  p.invT = 0; p.gun = 3;
  g.hurtPlayer(p, 999);
  ok('체력이 0 이면 격추', p.down === true);
  eq('격추되면 무기가 한 단계 내려감', p.gun, 2);
  ok('100단계는 1단계보다 더 아픔', (() => {
    const a = toPlay(newGame(1, 1)), b = toPlay(newGame(100, 1));
    return b.dmgMul > a.dmgMul * 2;
  })());

  // 적기와 몸이 겹쳐 있어도 초당 두 번까지만 아픕니다 (예전엔 매 틱 깎여 3초 만에 격추됐습니다)
  const gc = toPlay(newGame(1, 1));
  const pc = gc.players.get(1);
  pc.x = 700; pc.y = 450; pc.tx = 700; pc.ty = 450; pc.invT = 0;
  gc.enemies.length = 0;
  gc.spawnEnemy({ type: 'scout', hp: 9999, spd: 0, fire: 99, gap: 1, count: 1, form: 'line' },
    { x: 700, y: 450, delay: 0, pat: 'stop', amp: 0, per: 1, hold: 0.44 });
  const hp0 = pc.hp;
  for (let i = 0; i < 20; i++) {               // 1초치
    gc.spawnQ.length = 0;
    gc.setInput(1, { tx: 700, ty: 450 });
    gc.enemies[0].x = 700; gc.enemies[0].y = 450;
    gc.step();
  }
  const hits = (hp0 - pc.hp) / (S.CONTACT_DMG * gc.dmgMul);
  ok('겹쳐 있어도 1초에 두 번쯤만 아픔 (' + hits.toFixed(1) + '회)', hits <= 2.2 && hits >= 1);

  // 혼자 하다 격추되면 곧바로 전멸 처리 (혼자 14초를 기다리게 두지 않습니다)
  const gs = toPlay(newGame(1, 1));
  const solo = gs.players.get(1);
  solo.invT = 0; gs.hurtPlayer(solo, 999);
  gs.step();
  eq('혼자 하다 격추되면 바로 전멸', gs.phase, 'wipe');

  // 둘 이상일 때, 아무도 구하러 오지 않으면 목숨 하나를 쓰고 스스로 일어남
  const g2 = toPlay(newGame(1, 2));
  const q = g2.players.get(1), far = g2.players.get(2);
  q.invT = 0; g2.hurtPlayer(q, 999);
  const lives0 = q.lives;
  for (let i = 0; i < Math.ceil(S.DOWN_SEC / S.DT) + 4; i++) {
    far.invT = 999; far.x = 1500; far.y = 100; far.tx = 1500; far.ty = 100;   // 멀리 떨어져 있기
    g2.step();
  }
  ok('아무도 안 오면 목숨을 써서 부활', q.down === false && q.lives === lives0 - 1,
    'down=' + q.down + ' lives=' + q.lives + '/' + lives0);

  // 둘이면 옆에 있어 주는 것만으로 살아납니다
  const g3 = toPlay(newGame(1, 2));
  const a = g3.players.get(1), b = g3.players.get(2);
  a.invT = 0; g3.hurtPlayer(a, 999);
  ok('격추 상태', a.down === true);
  const lives1 = a.lives;
  for (let i = 0; i < Math.ceil(S.REVIVE_SEC / S.DT) + 3; i++) {
    b.x = a.x; b.y = a.y; b.tx = a.x; b.ty = a.y;   // 옆에 붙어 있기
    g3.step();
  }
  ok('친구가 붙어 있으면 살아남', a.down === false);
  eq('친구가 살리면 목숨은 안 줄어듦', a.lives, lives1);

  // 멀리 있으면 안 살아납니다
  const g4 = toPlay(newGame(1, 2));
  const c = g4.players.get(1), d = g4.players.get(2);
  c.invT = 0; g4.hurtPlayer(c, 999);
  for (let i = 0; i < Math.ceil(S.REVIVE_SEC / S.DT) + 3; i++) {
    d.x = 1500; d.y = 800; d.tx = 1500; d.ty = 800;
    g4.step();
  }
  ok('멀리 있으면 못 살림', c.down === true);

  // 전멸 → 같은 단계 다시
  const g5 = toPlay(newGame(3, 2));
  for (const p2 of g5.players.values()) { p2.invT = 0; g5.hurtPlayer(p2, 999); }
  g5.step();
  eq('다 쓰러지면 전멸 상태', g5.phase, 'wipe');
  let guard2 = 0;
  while (g5.phase === 'wipe' && guard2++ < 400) g5.step();
  eq('같은 단계를 처음부터 다시', g5.stage, 3);
  ok('전멸 후 모두 일어남', [...g5.players.values()].every((x) => !x.down));
}

/* ═════════ 7. 아이템 ═════════ */
grp('7. 아이템');
{
  const g = toPlay(newGame(1, 1));
  const p = g.players.get(1);
  p.gun = 1; g.grab(p, 'pow');
  eq('P 를 먹으면 무기 강화', p.gun, 2);
  p.gun = S.GUN_MAX; const sc = p.score; g.grab(p, 'pow');
  ok('무기가 최대면 점수로', p.gun === S.GUN_MAX && p.score > sc);
  p.hp = 10; g.grab(p, 'heal');
  eq('♥ 는 40 회복', p.hp, 50);
  p.hp = S.P_MAXHP - 5; g.grab(p, 'heal');
  eq('최대 체력을 넘지 않음', p.hp, S.P_MAXHP);
  p.bombs = 0; g.grab(p, 'bomb');
  eq('폭탄 하나 늘어남', p.bombs, 1);
  p.bombs = S.BOMB_MAX; g.grab(p, 'bomb');
  eq('폭탄은 최대치까지만', p.bombs, S.BOMB_MAX);
  g.grab(p, 'shield');

/* ═════════ 14. 실제로 깰 수 있는가 (자동 조종 봇) ═════════ */
grp('14. 자동 조종 봇으로 실제 클리어');
{
  // 총알을 피하면서 적을 쏘는 간단한 봇. 사람보다 훨씬 서투릅니다.
  function botStep(g) {
    for (const p of g.players.values()) {
      if (p.down) continue;
      let ax = 0, ay = 0;
      for (const b of g.bullets) {
        if (b.own !== -1) continue;
        const dx = p.x - b.x, dy = p.y - b.y;
        const d = Math.hypot(dx, dy);
        if (d < 220 && d > 1) { ax += dx / d * (220 - d); ay += dy / d * (220 - d); }
      }
      for (const e of g.enemies) {
        const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy);
        if (d < 180 && d > 1) { ax += dx / d * (180 - d) * 0.8; ay += dy / d * (180 - d) * 0.8; }
      }
      // 가장 가까운 적과 높이를 맞춥니다
      let tgt = null, bd = Infinity;
      for (const e of g.enemies) { const d = e.x - p.x; if (d > 0 && d < bd) { bd = d; tgt = e; } }
      if (g.boss) tgt = g.boss;
      const wantY = tgt ? tgt.y : 450;
      g.setInput(p.id, {
        tx: S.clamp(240 + ax * 0.5, 40, 700),
        ty: S.clamp((ay ? p.y + ay : wantY), 40, S.FIELD.h - 40),
      });
    }
  }
  const g = new S.Game({ stage: 1, seed: 2026 });
  for (let i = 0; i < 3; i++) g.addPlayer(i + 1, '봇' + (i + 1), i);
  let ticks = 0, wipes = 0;
  const seen = new Set();
  while (g.stage < 4 && ticks++ < 12000) {
    botStep(g);
    g.step();
    g.snapshot();               // 서버와 똑같이 매 틱 상태를 가져갑니다
    if (g.phase === 'wipe') wipes++;
    seen.add(g.stage);
  }
  ok('봇 3명이 1→3단계를 스스로 넘어감 (' + ticks + '틱, 전멸 ' + wipes + '회)', g.stage >= 4, '멈춘 단계: ' + g.stage);
  ok('중간에 단계를 건너뛰지 않음', seen.has(1) && seen.has(2) && seen.has(3));

  // 보스도 봇이 잡을 수 있는지 (10단계 · 20단계)
  for (const st of [10, 20]) {
    const gb = new S.Game({ stage: st, seed: 55 + st });
    for (let i = 0; i < 3; i++) gb.addPlayer(i + 1, '봇' + i, i);
    for (const p of gb.players.values()) p.gun = 4;
    let t2 = 0, bossSeen = 0, fightTicks = 0;
    const t0 = performance.now();
    while (gb.stage === st && t2++ < 20000) {
      botStep(gb); gb.step(); gb.snapshot();
      if (gb.boss) { bossSeen = 1; fightTicks++; }
    }
    ok('봇 3명이 ' + st + '단계 보스를 만나 잡음 (' + t2 + '틱, ' + Math.round(performance.now() - t0) + 'ms)',
      bossSeen && gb.stage > st, '보스만남=' + bossSeen + ' 단계=' + gb.stage);
    // 너무 빨리 끝나면 보스 싸움이 아니라 그냥 지나가는 장식이 됩니다
    ok('보스 싸움이 최소 20초는 이어짐 (' + Math.round(fightTicks * S.DT) + '초)', fightTicks * S.DT >= 20,
      fightTicks + '틱');
  }
}

  ok('100단계를 깨면 allclear 로 끝남', (() => {
    const g2 = newGame(100, 1);
    toPlay(g2);
    g2.finishStage();
    let n = 0; while (g2.phase === 'clear' && n++ < 400) g2.step();
    return g2.phase === 'allclear';
  })());
}

/* ═════════ 16. 1945 스타일 — 보조기·차지샷·메달 ═════════ */
grp('16. 보조기·차지샷·메달');
{
  eq('Lv1 은 보조기 없음', S.wingCount(1), 0);
  eq('Lv3 은 보조기 2대', S.wingCount(3), 2);
  eq('Lv5 는 보조기 4대(최대)', S.wingCount(9), 4);
  const g = toPlay(newGame(1, 1));
  const p = g.players.get(1);
  p.gun = 3; p.x = 400; p.y = 450; p.tx = 400; p.ty = 450;
  g.bullets.length = 0;
  run(g, 12);
  const w = g.bullets.filter((b) => b.kind === 'pw');
  ok('보조기가 따로 총을 쏨', w.length >= 2);
  ok('보조기 총알은 비행기 위아래에서 나감', w.some((b) => b.y < 420) && w.some((b) => b.y > 480));

  // 차지샷
  const g2 = toPlay(newGame(1, 1));
  const q = g2.players.get(1);
  q.charge = 0.5; g2.bullets.length = 0;
  g2.setInput(1, { charge: true });
  ok('게이지가 한 칸도 안 차면 차지샷이 안 나감', !g2.bullets.some((b) => b.kind === 'pc'));
  run(g2, Math.ceil(S.CHARGE_SEC * 3 / S.DT) + 2, god);
  ok('게이지는 저절로 차서 3칸에서 멈춤', Math.abs(q.charge - S.CHARGE_MAX) < 1e-9);
  g2.enemies.length = 0; g2.spawnQ.length = 0; g2.bullets.length = 0;
  q.x = 300; q.y = 450; q.tx = 300; q.ty = 450;
  const e1 = g2.spawnEnemy({ type: 'shieldy', hp: 150, spd: 0, fire: 99, gap: 1, count: 1, form: 'line' }, { x: 520, y: 450, delay: 0, pat: 'stop', amp: 0, per: 1, hold: 99 });
  const e2 = g2.spawnEnemy({ type: 'scout', hp: 150, spd: 0, fire: 99, gap: 1, count: 1, form: 'line' }, { x: 700, y: 452, delay: 0, pat: 'stop', amp: 0, per: 1, hold: 99 });
  g2.setInput(1, { charge: true });
  eq('쏘면 게이지가 비워짐', q.charge, 0);
  const pc = g2.bullets.find((b) => b.kind === 'pc');
  ok('차지탄이 나감', !!pc);
  for (let i = 0; i < 12; i++) { g2.spawnQ.length = 0; god(g2); g2.stepBullets(S.DT); g2.collide(); }
  ok('차지탄은 방패기까지 뚫고 뒤의 적도 맞힘', e1.hp < 150 && e2.hp < 150, 'hp ' + e1.hp + ', ' + e2.hp);
  ok('차지탄은 한 적을 한 번만 때림', e2.hp >= 150 - pc.dmg - 1e-6);

  // 메달 연쇄
  const g3 = toPlay(newGame(1, 1));
  const m = g3.players.get(1);
  const s0 = m.score; g3.grab(m, 'star'); const v1 = m.score - s0;
  const s1 = m.score; g3.grab(m, 'star'); const v2 = m.score - s1;
  eq('첫 메달은 100점', v1, 100);
  ok('이어 먹으면 더 비쌈 (' + v2 + ')', v2 > v1);
  run(g3, Math.ceil(S.CHAIN_SEC / S.DT) + 2, god);
  const s2 = m.score; g3.grab(m, 'star');
  eq('6초가 지나면 연쇄가 끊겨 다시 100점', m.score - s2, 100);

  // 튕기는 P
  const g4 = toPlay(newGame(1, 1));
  g4.players.get(1).x = 100; g4.players.get(1).tx = 100; g4.players.get(1).y = 800; g4.players.get(1).ty = 800;
  const k = g4.addPickup('pow', 900, 90);
  k.vy = -150;
  for (let i = 0; i < 10; i++) g4.stepPickups(S.DT);
  ok('P 아이템은 화면 끝에서 튕겨 나옴', k.vy > 0 && k.y >= 70);

  const sn = toPlay(newGame(1, 1)).snapshot();
  eq('스냅샷 아군 줄에 차지·메달 칸이 있음', sn.P[0].length, 17);
}

/* ═════════ 17. 기체 6종 ═════════ */
grp('17. 기체 6종');
{
  eq('기체가 6종', S.SHIP_TYPES.length, 6);
  const mk = (color, gun) => { const g = new S.Game({ stage: 1, seed: 5 }); g.addPlayer(1, 'A', color); toPlay(g); const p = g.players.get(1); p.gun = gun; p.x = 300; p.y = 450; p.tx = 300; p.ty = 450; g.bullets.length = 0; p.fireCd = 0; p.wingCd = 9; g.step(); return g; };
  const angs = (g) => g.bullets.filter((b) => b.own === 1 && b.kind[0] === 'p').map((b) => Math.abs(Math.atan2(b.vy, b.vx)));
  ok('노을부채는 하늘매보다 넓게 퍼짐', Math.max(...angs(mk(1, 3))) > Math.max(...angs(mk(0, 3))) * 1.5);
  ok('숲창 총알은 관통함', mk(2, 1).bullets.every((b) => b.kind[0] !== 'p' || b.pierce >= 1));
  ok('분홍망치 총알은 사거리가 짧음', mk(4, 1).bullets.some((b) => b.own === 1 && b.life < 1));
  const gb = new S.Game({ stage: 1, seed: 1 }); gb.addPlayer(1, 'A', 5);
  eq('금빛독수리는 폭탄 하나 더 들고 시작', gb.players.get(1).bombs, 3);
  const chargeOf = (color) => { const g = mk(color, 1); g.bullets.length = 0; const p = g.players.get(1); p.charge = 3; g.setInput(1, { charge: true }); return g.bullets.filter((b) => b.cg); };
  eq('하늘매 차지: 거대 포탄 1발', chargeOf(0).length, 1);
  eq('노을부채 차지: 부채꼴 9발', chargeOf(1).length, 9);
  ok('숲창 차지: 한 줄로 늘어선 창', (() => { const c = chargeOf(2); return c.length >= 8 && c.every((b) => b.y === c[0].y); })());
  ok('보라벌 차지: 유도 미사일', chargeOf(3).every((b) => b.hom > 0 && b.kind === 'pm'));
  ok('분홍망치 차지: 사방으로 퍼짐', (() => { const c = chargeOf(4); return c.some((b) => b.vx < 0) && c.some((b) => b.vy < 0) && c.some((b) => b.vy > 0); })());
  ok('금빛독수리 차지: 세로 한 줄 폭격', (() => { const c = chargeOf(5); const ys = c.map((b) => b.y); return Math.max(...ys) - Math.min(...ys) > 400; })());
  // 유도 미사일은 적을 쫓아감
  const gm = mk(3, 1); gm.enemies.length = 0; gm.spawnQ.length = 0; gm.bullets.length = 0;
  gm.spawnEnemy({ type: 'scout', hp: 999, spd: 0, fire: 99, gap: 1, count: 1, form: 'line' }, { x: 700, y: 150, delay: 0, pat: 'stop', amp: 0, per: 1, hold: 99 });
  const ms = gm.addBullet({ x: 340, y: 450, vx: 520, vy: 0, r: 12, dmg: 1, own: 1, kind: 'pm', hom: 4.2, cg: 1 });
  for (let i = 0; i < 6; i++) gm.stepBullets(S.DT);
  ok('유도 미사일이 적 쪽으로 방향을 틈', ms.vy < 0);
  ok('유도 미사일은 스냅샷 유도탄 목록으로 감', gm.snapshot().HB.some((r) => r[4] === 'pm'));
}

/* ═════════ 18. 지형과 지상 목표물 ═════════ */
grp('18. 지형·지상 목표물·금괴');
{
  eq('우주에는 땅이 없음', S.terrainAt(9, 500, 400, 0), null);
  let sea = 0, land = 0;
  for (let x = 0; x < 1600; x += 50) for (let y = 0; y < 900; y += 50) { const t = S.terrainAt(0, x, y, 0); if (t === 'sea') sea++; else if (t === 'land') land++; }
  ok('섬 지역에는 바다와 땅이 섞여 있음 (바다 ' + sea + ', 땅 ' + land + ')', sea > 40 && land > 40);
  ok('땅은 한 틱마다 정해진 만큼 흘러감', (() => {
    for (let k = 0; k < 40; k++) { const x = 300 + k * 29, y = 100 + k * 17; if (S.terrainAt(0, x, y, 100) !== S.terrainAt(0, x - S.GROUND_SPEED * S.DT, y, 101)) return false; }
    return true;
  })());
  const g = toPlay(newGame(3, 2));
  let spawned = 0, wrong = 0;
  const seen = new Set();
  for (let i = 0; i < 1200; i++) {
    god(g); g.step();
    for (const t of g.grounds) if (!seen.has(t.id)) {
      seen.add(t.id); spawned++;
      const on = S.terrainAt(g.plan.zone, t.x, t.y, g.tick);
      if ((S.GROUND_UNITS[t.type].on === 'sea') !== (on === 'sea' || on === 'lake')) wrong++;
    }
  }
  ok('지상 목표물이 나옴 (' + spawned + '개)', spawned >= 3);
  eq('군함은 바다에, 전차는 땅에 나옴', wrong, 0);
  const g2 = toPlay(newGame(1, 1));
  g2.grounds.push({ id: 999, type: 'tank', x: 800, y: 400, hp: 10, maxHp: 10, r: 20, ang: Math.PI, fireCd: 9, flash: 0 });
  const x0 = g2.grounds[0].x; g2.stepGrounds(S.DT);
  near('지상 목표물은 땅과 같은 빠르기로 흘러감', x0 - g2.grounds[0].x, S.GROUND_SPEED * S.DT, 1e-6);
  g2.pickups.length = 0;
  g2.damageGround(0, 999, g2.players.get(1));
  eq('부수면 사라짐', g2.grounds.length, 0);
  ok('금괴를 떨어뜨림', g2.pickups.some((k) => k.type === 'gold'));
  const p = g2.players.get(1), sc = p.score;
  g2.grab(p, 'gold');
  ok('금괴를 먹으면 점수와 금괴 수가 오름', p.score > sc && p.sg === 1);
  const sn = g2.snapshot();
  ok('스냅샷에 지상 목표물 칸이 있음', Array.isArray(sn.GT));
  eq('하늘 높은 곳(성층권)에서는 지상 목표물이 없음', S.ZONE_GROUND[8].length, 0);
}

/* ═════════ 19. 부품 보스 ═════════ */
grp('19. 부품 보스');
{
  const bossGame = (st) => { const g = toPlay(newGame(st, 1)); let n = 0; while (!g.boss && n++ < 9000) { god(g); g.enemies.length = 0; g.spawnQ.length = 0; g.step(); } run(g, 120, god); return g; };
  const g = bossGame(10);
  eq('10단계 보스는 포탑 2개', g.boss.parts.length, 2);
  eq('100단계 보스는 포탑 4개', bossGame(100).boss.parts.length, 4);
  ok('처음에는 장갑 상태', g.boss.armored === true);
  const hp0 = g.boss.hp; g.damageBoss(100, null);
  near('장갑 상태에서는 본체가 35%만 맞음', hp0 - g.boss.hp, 100 * S.ARMOR_MUL, 1e-6);
  g.fx.length = 0;
  for (let i = 0; i < g.boss.parts.length; i++) g.damagePart(i, 1e9, g.players.get(1));
  ok('포탑을 다 부수면 장갑이 벗겨짐', g.boss.armored === false && g.fx.some((f) => f.t === 'armorbreak'));
  const hp1 = g.boss.hp; g.damageBoss(100, null);
  near('장갑이 벗겨지면 제대로 맞음', hp1 - g.boss.hp, 100, 1e-6);
  ok('부서진 포탑마다 금괴', g.pickups.filter((k) => k.type === 'gold').length >= 2);
  const b = g.snapshot().B;
  ok('스냅샷에 포탑 정보가 있음', Array.isArray(b[9]) && b[9].length === 2 && b[10] === 0);
  // 포탑은 총알로도 맞음
  const g3 = bossGame(10);
  const pt = g3.boss.parts[0], php = pt.hp;
  g3.bullets.length = 0;
  g3.enemies.length = 0; g3.grounds.length = 0;
  g3.addBullet({ x: g3.boss.x + pt.dx - 10, y: g3.boss.y + pt.dy, vx: 1000, vy: 0, r: 6, dmg: 20, own: 1, kind: 'p1' });
  g3.collide();
  ok('포탑은 총알에 맞음', pt.hp < php);
}

/* ═════════ 20. 결과 화면 ═════════ */
grp('20. 단계 결과');
{
  const clearOnce = (slow) => {
    const g = toPlay(newGame(2, 2));
    if (slow) run(g, Math.round(200 / S.DT), (gg) => { god(gg); gg.enemies.length = 0; gg.spawnQ.length = 0; gg.waveIdx = 0; });
    g.fx.length = 0;
    let n = 0; while (g.phase === 'play' && n++ < 6000) { god(g); g.enemies.length = 0; g.spawnQ.length = 0; g.step(); }
    return g.fx.find((f) => f.t === 'clear') || (g.snapshot(), null);
  };
  const fast = clearOnce(false);
  ok('클리어하면 결과가 나옴', !!fast && Array.isArray(fast.P) && fast.P.length === 2);
  ok('결과에 걸린 시간과 시간 보너스', fast && fast.time > 0 && fast.timeBonus >= 0);
  const slow = clearOnce(true);
  ok('빨리 깨면 시간 보너스가 더 큼 (' + (fast && fast.timeBonus) + ' > ' + (slow && slow.timeBonus) + ')', fast && slow && fast.timeBonus > slow.timeBonus);
  const g = toPlay(newGame(1, 1)); const p = g.players.get(1);
  g.grab(p, 'star'); g.grab(p, 'gold');
  ok('단계 기록: 메달·금괴 수를 셈', p.sm === 1 && p.sg === 1);
}

} catch (err) {
  ok('테스트가 끝까지 돌아감', false, (err && err.message) + '  ·  ' + String(err && err.stack).split('\n').slice(0, 3).join(' ← '));
}

/* ── 결과 ── */
const sum = document.getElementById('sum');
sum.innerHTML = fail === 0
  ? '<span class="ok">✔ 전부 통과 — ' + pass + '건</span>'
  : '<span class="bad">✘ ' + fail + '건 실패</span> <span class="ok">/ ' + pass + '건 통과</span>';
window.__RESULT__ = { pass, fail };
})();
</script>
